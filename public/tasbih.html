<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>التسبيح | ثمار</title>
<link rel="icon" href="/images/icon-tasbih.png">
<style>
  :root{ --primary:#1d5038; --accent:#e08a2c; --bg:#f4f6f5; --card:#ffffff; --text:#1c2b24; --muted:#6b7a72; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Tahoma','Segoe UI',sans-serif;background:var(--bg);color:var(--text);}
  header{background:linear-gradient(135deg,var(--primary),#2f6e4f);color:#fff;padding:18px 16px 22px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 14px rgba(0,0,0,.12);}
  header img{width:38px;height:38px;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25));}
  header h1{margin:0;font-size:1.15rem;}
  .back-btn{margin-inline-start:auto;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:10px;padding:8px 14px;font-size:.85rem;cursor:pointer;}
  .container{max-width:480px;margin:0 auto;padding:26px 18px 40px;display:flex;flex-direction:column;align-items:center;gap:22px;}
  .zikr-select{width:100%;display:flex;gap:8px;overflow-x:auto;}
  .zikr-btn{flex:none;padding:8px 14px;border-radius:20px;background:var(--card);border:1px solid #e2e6e3;font-size:.82rem;font-weight:700;cursor:pointer;color:var(--muted);}
  .zikr-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .counter-ring{position:relative;width:250px;height:250px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--pct,0)*1%), #e7ece8 0);display:flex;align-items:center;justify-content:center;transition:background .2s;}
  .counter-inner{width:210px;height:210px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 2px 8px rgba(0,0,0,.06);}
  .count-num{font-size:3rem;font-weight:900;color:var(--primary);}
  .count-label{font-size:.95rem;color:var(--muted);margin-top:4px;}
  .tap-btn{width:100%;max-width:300px;padding:20px;border-radius:20px;border:none;background:linear-gradient(135deg,var(--primary),#2f6e4f);color:#fff;font-size:1.2rem;font-weight:800;cursor:pointer;box-shadow:0 8px 18px rgba(29,80,56,.3);user-select:none;}
  .tap-btn:active{transform:scale(.97);}
  .actions{display:flex;gap:10px;width:100%;max-width:300px;}
  .actions button{flex:1;padding:10px;border-radius:12px;border:1px solid #dfe4e1;background:var(--card);color:var(--text);font-size:.85rem;cursor:pointer;}
  .total-note{font-size:.85rem;color:var(--muted);}
</style>
</head>
<body>
<header>
  <img src="/images/icon-tasbih.png" alt="التسبيح">
  <h1>التسبيح</h1>
  <button class="back-btn" onclick="window.close(); if(!window.closed){history.back();}">إغلاق</button>
</header>
<div class="container">
  <div class="zikr-select" id="zikrSelect"></div>
  <div class="counter-ring" id="ring">
    <div class="counter-inner">
      <div class="count-num" id="countNum">0</div>
      <div class="count-label" id="targetLabel">الهدف: 33</div>
    </div>
  </div>
  <button class="tap-btn" id="tapBtn">اضغط للتسبيح</button>
  <div class="actions">
    <button id="resetBtn">تصفير</button>
    <button id="targetBtn">تغيير الهدف</button>
  </div>
  <div class="total-note" id="totalNote">إجمالي التسبيحات اليوم: 0</div>
</div>
<script>
var ZIKRS = ['سبحان الله','الحمد لله','الله أكبر','لا إله إلا الله','أستغفر الله'];
var targets = [33, 100, 1000];
var targetIdx = 0;
var current = 0;
var activeZikr = 0;
var STORAGE_KEY = 'tasbih_daily_total';

function loadTotal(){
  var raw = localStorage.getItem(STORAGE_KEY);
  var today = new Date().toDateString();
  if(raw){
    try{ var data = JSON.parse(raw); if(data.date === today) return data.total; }catch(e){}
  }
  return 0;
}
function saveTotal(total){
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ date:new Date().toDateString(), total: total }));
}
var dailyTotal = loadTotal();

var sel = document.getElementById('zikrSelect');
ZIKRS.forEach(function(z, i){
  var b = document.createElement('button');
  b.className = 'zikr-btn' + (i===0 ? ' active' : '');
  b.textContent = z;
  b.onclick = function(){
    activeZikr = i;
    document.querySelectorAll('.zikr-btn').forEach(function(el,idx){ el.classList.toggle('active', idx===i); });
    current = 0; render();
  };
  sel.appendChild(b);
});

function render(){
  document.getElementById('countNum').textContent = current;
  document.getElementById('targetLabel').textContent = 'الهدف: ' + targets[targetIdx];
  var pct = Math.min(100, (current / targets[targetIdx]) * 100);
  document.getElementById('ring').style.setProperty('--pct', pct);
  document.getElementById('totalNote').textContent = 'إجمالي التسبيحات اليوم: ' + dailyTotal;
}

document.getElementById('tapBtn').addEventListener('click', function(){
  current++;
  dailyTotal++;
  saveTotal(dailyTotal);
  if(navigator.vibrate) navigator.vibrate(15);
  if(current >= targets[targetIdx]){
    current = 0;
  }
  render();
});
document.getElementById('resetBtn').addEventListener('click', function(){ current = 0; render(); });
document.getElementById('targetBtn').addEventListener('click', function(){
  targetIdx = (targetIdx + 1) % targets.length;
  current = 0;
  render();
});
render();
</script>
</body>
</html>
