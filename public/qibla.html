<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1d5038">
<meta name="description" content="اتجاه القبلة — منصة ثمار">
<title>اتجاه القبلة | ثمار</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;700;900&display=swap">
<style>
:root{--green:#1d5038;--green2:#28734f;--gold:#bf994a;--bg:#0d1f16;--card:#132a1e;--text:#eef6ef;--text-light:#9db7a8;--border:#254636}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Noto Kufi Arabic','Segoe UI',Tahoma,sans-serif;background:radial-gradient(circle at 50% 0%,#173627,var(--bg) 60%);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:10px;padding:14px}
.icon-btn{width:38px;height:38px;flex:none;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.1rem;cursor:pointer}
.icon-btn:hover{background:rgba(255,255,255,.16)}
.topbar h1{flex:1;text-align:center;margin:0;font-size:1.1rem;font-weight:900}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 18px 40px;text-align:center;gap:18px}
.status-card{width:min(92%,380px);background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 18px;font-size:.92rem;color:var(--text-light)}
.status-card strong{color:var(--gold)}
.compass-wrap{position:relative;width:min(78vw,300px);height:min(78vw,300px);margin:6px auto}
.compass-ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--border);background:radial-gradient(circle,#173627 0%,#0f2419 100%);box-shadow:0 0 0 8px rgba(191,153,74,.05),0 20px 50px rgba(0,0,0,.4)}
.compass-tick{position:absolute;inset:10px;border-radius:50%}
.dir-label{position:absolute;font-weight:900;color:var(--text-light);font-size:.85rem}
.dir-n{top:6px;left:50%;transform:translateX(-50%);color:var(--gold)}
.dir-e{top:50%;right:6px;transform:translateY(-50%)}
.dir-s{bottom:6px;left:50%;transform:translateX(-50%)}
.dir-w{top:50%;left:6px;transform:translateY(-50%)}
.needle{position:absolute;left:50%;top:50%;width:6px;height:42%;background:linear-gradient(to top,transparent,var(--gold) 55%,#fff);border-radius:6px;transform-origin:bottom center;transform:translate(-50%,-100%) rotate(0deg);transition:transform .25s ease-out}
.needle::before{content:'';position:absolute;top:-16px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:16px solid var(--gold)}
.kaaba-dot{position:absolute;left:50%;top:50%;width:34px;height:34px;transform:translate(-50%,-50%);border-radius:8px;background:#111;border:2px solid var(--gold);box-shadow:0 0 0 4px rgba(191,153,74,.15)}
.center-dot{position:absolute;left:50%;top:50%;width:10px;height:10px;transform:translate(-50%,-50%);border-radius:50%;background:var(--gold)}
.bearing-readout{font-size:2.1rem;font-weight:900;color:var(--gold)}
.bearing-sub{font-size:.85rem;color:var(--text-light)}
.enable-btn{border:none;background:linear-gradient(135deg,var(--green2),var(--green));color:#fff;padding:14px 26px;border-radius:14px;font-weight:800;font-family:inherit;font-size:1rem;cursor:pointer;box-shadow:0 10px 24px rgba(0,0,0,.35)}
.enable-btn:hover{filter:brightness(1.08)}
.hint{font-size:.82rem;color:var(--text-light);max-width:320px;line-height:1.7}
.hidden{display:none!important}
</style>
</head>
<body>
<header class="topbar">
  <button type="button" class="icon-btn" onclick="window.close();history.length>1?history.back():location.href='/app.html'" aria-label="رجوع">✕</button>
  <h1>اتجاه القبلة</h1>
  <span style="width:38px"></span>
</header>

<main>
  <div class="status-card" id="statusCard">جاري تحديد موقعك لحساب اتجاه القبلة بدقة…</div>

  <div class="compass-wrap">
    <div class="compass-ring">
      <div class="compass-tick"></div>
      <span class="dir-label dir-n">شمال</span>
      <span class="dir-label dir-e">شرق</span>
      <span class="dir-label dir-s">جنوب</span>
      <span class="dir-label dir-w">غرب</span>
      <div class="needle" id="needle"><div class="kaaba-dot" id="kaabaDot" style="top:-30px"></div></div>
      <div class="center-dot"></div>
    </div>
  </div>

  <div>
    <div class="bearing-readout" id="bearingReadout">--°</div>
    <div class="bearing-sub" id="bearingSub">اتجاه القبلة من الشمال الجغرافي</div>
  </div>

  <button type="button" class="enable-btn" id="enableCompassBtn">تفعيل البوصلة</button>
  <p class="hint">قم بوضع هاتفك مستوياً أمامك ثم اسمح بالوصول للموقع والبوصلة. يشير السهم الذهبي إلى اتجاه الكعبة المشرفة بعد التفعيل.</p>
</main>

<script>
var KAABA = { lat: 21.4225, lon: 39.8262 };
var qiblaBearing = null;
var needle = document.getElementById('needle');
var statusCard = document.getElementById('statusCard');
var bearingReadout = document.getElementById('bearingReadout');
var bearingSub = document.getElementById('bearingSub');
var enableBtn = document.getElementById('enableCompassBtn');
var compassActive = false;
var lastHeading = 0;

function toRad(d){ return d * Math.PI / 180; }
function toDeg(r){ return r * 180 / Math.PI; }

function computeQiblaBearing(lat, lon){
  var phi = toRad(lat), phiK = toRad(KAABA.lat);
  var lambda = toRad(lon), lambdaK = toRad(KAABA.lon);
  var dLambda = lambdaK - lambda;
  var y = Math.sin(dLambda) * Math.cos(phiK);
  var x = Math.cos(phi) * Math.sin(phiK) - Math.sin(phi) * Math.cos(phiK) * Math.cos(dLambda);
  var bearing = toDeg(Math.atan2(y, x));
  return (bearing + 360) % 360;
}

function applyStaticBearing(){
  needle.style.transform = 'translate(-50%,-100%) rotate(' + qiblaBearing + 'deg)';
}

function applyHeadingBearing(heading){
  var rel = (qiblaBearing - heading + 360) % 360;
  needle.style.transform = 'translate(-50%,-100%) rotate(' + rel + 'deg)';
}

function updateReadout(){
  bearingReadout.textContent = Math.round(qiblaBearing) + '°';
}

navigator.geolocation && navigator.geolocation.getCurrentPosition(
  function(pos){
    var lat = pos.coords.latitude, lon = pos.coords.longitude;
    qiblaBearing = computeQiblaBearing(lat, lon);
    updateReadout();
    applyStaticBearing();
    statusCard.innerHTML = 'تم تحديد موقعك. اتجاه القبلة <strong>' + Math.round(qiblaBearing) + '°</strong> من الشمال. فعّل البوصلة لمحاذاة هاتفك تلقائياً.';
  },
  function(){
    qiblaBearing = computeQiblaBearing(30.0444, 31.2357);
    updateReadout();
    applyStaticBearing();
    statusCard.textContent = 'تعذّر الوصول لموقعك، تم استخدام موقع تقريبي. فعّل خدمة الموقع لنتيجة أدق.';
  },
  { enableHighAccuracy:true, timeout:8000 }
);

function startCompass(){
  if(compassActive) return;
  compassActive = true;
  bearingSub.textContent = 'وجّه أعلى الهاتف نحو السهم الذهبي';

  function handleOrientation(e){
    var heading = null;
    if(typeof e.webkitCompassHeading === 'number'){
      heading = e.webkitCompassHeading;
    } else if(e.alpha !== null){
      heading = 360 - e.alpha;
    }
    if(heading === null || qiblaBearing === null) return;
    lastHeading = heading;
    applyHeadingBearing(heading);
  }

  if(typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function'){
    DeviceOrientationEvent.requestPermission().then(function(result){
      if(result === 'granted'){
        window.addEventListener('deviceorientation', handleOrientation, true);
      } else {
        statusCard.textContent = 'تم رفض إذن البوصلة، سيتم عرض الاتجاه الثابت من الشمال فقط.';
      }
    }).catch(function(){
      statusCard.textContent = 'تعذّر تفعيل البوصلة على هذا المتصفح.';
    });
  } else if('ondeviceorientationabsolute' in window || 'ondeviceorientation' in window){
    window.addEventListener('deviceorientationabsolute' in window ? 'deviceorientationabsolute' : 'deviceorientation', handleOrientation, true);
  } else {
    statusCard.textContent = 'هذا الجهاز/المتصفح لا يدعم البوصلة، سيتم عرض الاتجاه الثابت من الشمال فقط.';
  }
  enableBtn.textContent = 'البوصلة مُفعّلة';
  enableBtn.disabled = true;
}

enableBtn.addEventListener('click', startCompass);
</script>
</body>
</html>
