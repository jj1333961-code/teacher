<style>
:root{--ink:#062d2b;--deep:#031d20;--gold:#d3aa5b;--cream:#f6f0e5;--muted:#c8d2c8}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'Noto Kufi Arabic',Tahoma,sans-serif}body{min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:auto;padding:18px;background:radial-gradient(circle at 50% 0%,#17483f 0,#062d2b 42%,#03191d 100%);color:var(--cream)}body:before{content:'';position:fixed;inset:12px;border:1px solid rgba(211,170,91,.22);border-radius:30px;pointer-events:none}main{width:min(430px,100%);min-height:calc(100vh - 36px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:38px 28px 28px;position:relative;overflow:hidden}main:before{content:'';position:absolute;inset:7% 8% 4%;border:2px solid var(--gold);border-radius:48% 48% 16px 16px/24% 24% 12px 12px;opacity:.85;pointer-events:none;clip-path:polygon(50% 0,100% 18%,100% 100%,0 100%,0 18%)}main:after{content:'';position:absolute;inset:9% 12% 7%;border:1px solid rgba(211,170,91,.35);border-radius:46% 46% 12px 12px/22% 22% 10px 10px;pointer-events:none}main>*{position:relative;z-index:1}.mark{font-size:40px;color:var(--gold);line-height:1;margin-bottom:3px}.mark svg{width:52px;height:52px;fill:var(--gold)}h1{margin:0;color:var(--cream);font-size:clamp(3.5rem,16vw,5.4rem);font-weight:900;letter-spacing:-.08em;line-height:1.05;text-shadow:0 3px 0 rgba(211,170,91,.22)}.latin{color:var(--gold);font-family:Arial,sans-serif;font-size:.82rem;letter-spacing:.38em;margin:4px 0 12px;direction:ltr}.subtitle{margin:0;color:var(--cream);font-size:1.1rem;font-weight:700}.description{margin:8px 0 8px;color:var(--muted);font-size:.92rem;line-height:1.9}.hero-art{width:min(290px,74vw);height:190px;object-fit:contain;filter:drop-shadow(0 18px 20px rgba(0,0,0,.45));margin:10px 0 0}.quran-illustration{width:min(290px,74vw);height:175px;margin:13px 0 8px;position:relative;filter:drop-shadow(0 18px 20px rgba(0,0,0,.38))}.quran-illustration:before{content:'';position:absolute;left:14%;right:14%;bottom:11px;height:18px;background:#5d3d25;transform:perspective(80px) rotateX(25deg);border-radius:3px 3px 12px 12px;box-shadow:0 6px 0 #38281d}.quran-illustration:after{content:'۞  ۞  ۞';position:absolute;left:13%;right:13%;top:30px;height:100px;padding:27px 10px;color:#806238;text-align:center;font-family:'Amiri',serif;font-size:1.12rem;line-height:2;background:linear-gradient(125deg,#e7dbc0 0 49%,#f5ead0 50% 100%);border-radius:5px 18px 4px 15px;transform:skewY(-7deg) rotate(-4deg);box-shadow:inset -8px 0 0 rgba(105,72,34,.18),inset 0 -4px 0 rgba(75,48,28,.18)}.ayah{margin:0 0 20px;color:var(--cream);font-family:'Amiri',serif;font-size:1.18rem;line-height:1.8}.ayah:before,.ayah:after{content:'۞';color:var(--gold);font-size:.8em;margin-inline:7px}.actions{width:min(280px,100%);display:grid;gap:11px;margin-top:5px}.btn{width:100%;padding:13px 18px;border-radius:28px;font-family:inherit;font-size:.95rem;font-weight:700;cursor:pointer}.primary{border:1px solid var(--gold);background:linear-gradient(135deg,#e1ba67,#b88936);color:#17291f;box-shadow:0 10px 25px rgba(0,0,0,.25)}.secondary{border:1px solid var(--gold);background:transparent;color:var(--cream)}.direct{margin-top:14px;border:0;background:none;color:var(--muted);font:inherit;font-size:.76rem;cursor:pointer}.status{margin:12px 0 0;color:var(--muted);font-size:.7rem}.fallback{display:none}
.direct,.status{display:none}.ayah{order:5;margin:16px 0 0;color:rgba(246,240,229,.7);font-family:'Amiri',serif;font-size:1.05rem;line-height:1.75}.ayah span{display:inline-block;color:var(--cream);font-size:1.28rem}.ayah small{font-size:.82rem;color:rgba(246,240,229,.62)}.actions{order:4;width:min(290px,82vw);display:flex;flex-direction:column;gap:12px}.quran-illustration{order:3}.subtitle,.description{order:2}.mark,h1,.latin{order:1}@media (max-height:700px){main{padding-top:20px;padding-bottom:18px}.mark svg{width:40px;height:40px}h1{font-size:clamp(3rem,14vw,4.4rem)}.description{margin:4px 0}.quran-illustration{height:130px;margin:4px 0}.actions{gap:8px}.btn{padding:10px 18px}.ayah{margin-top:8px}}</style></head>
<body><main aria-live="polite"><div class="mark" aria-hidden="true"><svg viewBox="0 0 64 64"><path d="M33 55C30 39 31 23 45 10c1 13-2 25-12 33l-1 12h-5l1-12C17 31 13 21 15 8c13 7 18 17 17 29 4-7 10-11 18-14-2 11-8 18-17 22z"/></svg></div><h1>ثمار</h1><div class="latin">TMAR</div><p class="subtitle">منصة ثمار</p><p class="description">لحفظ القرآن الكريم<br>وتعلم العلوم الشرعية</p><div class="quran-illustration" role="img" aria-label="مصحف مفتوح على حامل خشبي"></div><div class="actions"><button id="enterPlatform" class="btn primary" type="button">تسجيل الدخول</button><button id="createAccount" class="btn secondary" type="button">إنشاء حساب جديد</button></div><p class="ayah">قال تعالى:<br><span>وَرَتِّلِ الْقُرْآنَ تَرْتِيلًا</span><br><small>(المزمل: 4)</small></p><button id="skipWelcome" class="direct" type="button" aria-label="الدخول مباشرة">الدخول مباشرة</button><p id="status" class="status">اضغط لتسجيل الدخول والاستماع إلى التلاوة</p><audio id="welcomeAudio" preload="auto" playsinline src="/audio/ibrahim-ayah-24-minshawi.mp3"></audio></main>
<script>(function(){const audio=document.getElementById('welcomeAudio'),status=document.getElementById('status'),enterButton=document.getElementById('enterPlatform'),skipButton=document.getElementById('skipWelcome'),createButton=document.getElementById('createAccount');let moving=false,started=false;function warmMainPage(){Promise.allSettled([fetch('/app.html',{cache:'force-cache',credentials:'same-origin'}),fetch('/app-core.js',{cache:'force-cache',credentials:'same-origin'})]).then(function(){if(!started)status.textContent='المنصة جاهزة. اضغط لتسجيل الدخول والاستماع.'})}warmMainPage();function enterApp(){if(moving)return;moving=true;status.textContent='جاري الدخول إلى المنصة...';location.replace('/app.html')}audio.addEventListener('ended',enterApp,{once:true});audio.addEventListener('error',function(){status.textContent='تعذر تشغيل التلاوة، جاري الدخول...';setTimeout(enterApp,300)},{once:true});skipButton.addEventListener('click',enterApp);createButton.addEventListener('click',function(){location.replace('/app.html?goto=signup')});enterButton.addEventListener('click',function(){if(started)return;started=true;enterButton.disabled=true;enterButton.textContent='جاري تشغيل التلاوة...';status.textContent='جاري تشغيل التلاوة...';const playPromise=audio.play();if(playPromise&&playPromise.catch)playPromise.catch(function(){started=false;enterButton.disabled=false;enterButton.textContent='تسجيل الدخول';status.textContent='تعذر تشغيل التلاوة. اضغط مرة أخرى للمحاولة.'})})})();</script></body></html>
