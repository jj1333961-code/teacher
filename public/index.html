<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#315c4b">
  <meta name="description" content="ثمار — منصة قرآنية هادئة للتسميع والاختبارات والمهام والنمو العلمي.">
  <title>ثمار | منصة القرآن والتعليم</title>
  <style>
    :root { color-scheme: light; --bg:#d7e7dc; --card:#fffdf7; --text:#263c34; --muted:#6c7d74; --primary:#315c4b; --shadow:0 16px 40px rgba(39,76,59,.12); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:20px; color:var(--text); background:linear-gradient(135deg,#eaf1e8 0%,var(--bg) 100%); font-family:'Segoe UI',Tahoma,sans-serif; }
    main { width:min(100%,720px); text-align:center; }
    .welcome { padding:clamp(28px,7vw,64px) clamp(20px,6vw,56px); background:var(--card); border:1px solid rgba(49,92,75,.14); border-radius:28px; box-shadow:var(--shadow); }
    h1 { margin:0 0 10px; color:var(--primary); font-size:clamp(2.3rem,8vw,4.5rem); }
    h2 { margin:0 0 14px; font-size:clamp(1.2rem,3vw,1.7rem); }
    p { color:var(--muted); line-height:1.7; }
    .ayah { color:var(--primary); font-family:Georgia,serif; font-size:clamp(1rem,2.8vw,1.35rem); line-height:2; }
    .actions { display:flex; flex-wrap:wrap; justify-content:center; gap:12px; margin-top:28px; }
    button { min-height:48px; padding:12px 22px; border:0; border-radius:12px; color:#fff; background:var(--primary); font:inherit; font-weight:700; cursor:pointer; }
    button:hover { filter:brightness(.94); }
    button:disabled { opacity:.7; cursor:wait; }
    .hint { min-height:1.5em; margin:16px 0 0; font-size:.9rem; }
    .secondary { background:transparent; border:2px solid var(--primary); color:var(--primary); }
    noscript { display:block; margin-top:16px; }
  </style>
</head>
<body>
  <main>
    <section class="welcome" aria-labelledby="title">
      <h1 id="title">ثمار</h1>
      <h2>منصة ثمار ترحب بكم</h2>
      <p class="ayah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ<br>أَلَمْ تَرَ كَيْفَ ضَرَبَ اللَّهُ مَثَلًا كَلِمَةً طَيِّبَةً</p>
      <p>منصة كاملة لطالب القرآن</p>
      <div class="actions">
        <button type="button" data-load="adminLogin">الدخول كمسؤول</button>
        <button type="button" data-load="studentLogin">الدخول كطالب</button>
        <button type="button" data-load="parentLogin">الدخول كولي أمر</button>
        <button type="button" class="secondary" data-load="signupStep1">إنشاء حساب جديد</button>
      </div>
      <p class="hint" id="status" role="status" aria-live="polite"></p>
    </section>
  </main>
  <noscript>يرجى تفعيل JavaScript لاستخدام المنصة.</noscript>
  <script>
    (() => {
      const buttons = [...document.querySelectorAll('[data-load]')];
      const status = document.getElementById('status');
      let loading = false;
      async function loadApplication(target) {
        if (loading) return;
        loading = true;
        buttons.forEach((button) => { button.disabled = true; });
        status.textContent = 'جاري تحميل مساحة الاستخدام المطلوبة…';
        try {
          const response = await fetch('/app-shell.html', { cache: 'no-store' });
          if (!response.ok) throw new Error('app-shell-load-failed');
          const html = await response.text();
          sessionStorage.setItem('thimar_requested_page', target);
          sessionStorage.setItem('thimar_welcome_seen_v1', '1');
          document.open();
          document.write(html);
          document.close();
        } catch (error) {
          loading = false;
          buttons.forEach((button) => { button.disabled = false; });
          status.textContent = 'تعذر تحميل المنصة. يرجى المحاولة مرة أخرى.';
          console.error('[v0] Failed to load requested application shell', error);
        }
      }
      buttons.forEach((button) => button.addEventListener('click', () => loadApplication(button.dataset.load)));
    })();
  </script>
</body>
</html>
