<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>المزيد | ثمار</title>
<link rel="icon" href="/images/icon-more.png">
<style>
  :root{ --primary:#1d5038; --bg:#f4f6f5; --card:#ffffff; --text:#1c2b24; --muted:#6b7a72; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Tahoma','Segoe UI',sans-serif;background:var(--bg);color:var(--text);}
  header{background:linear-gradient(135deg,var(--primary),#2f6e4f);color:#fff;padding:18px 16px 22px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 14px rgba(0,0,0,.12);}
  header img{width:38px;height:38px;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25));}
  header h1{margin:0;font-size:1.15rem;}
  .back-btn{margin-inline-start:auto;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:10px;padding:8px 14px;font-size:.85rem;cursor:pointer;}
  .container{max-width:780px;margin:0 auto;padding:22px 14px 40px;}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;}
  .tool-card{background:var(--card);border-radius:16px;padding:20px 14px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.05);cursor:pointer;border:1px solid #e6ebe7;display:flex;flex-direction:column;align-items:center;gap:10px;}
  .tool-card:hover{border-color:var(--primary);transform:translateY(-2px);transition:.2s;}
  .tool-emoji{font-size:2.4rem;}
  .tool-name{font-weight:800;font-size:.95rem;color:var(--text);}
  .tool-desc{font-size:.78rem;color:var(--muted);}
  @media(max-width:480px){ .grid{grid-template-columns:1fr 1fr;} }
</style>
</head>
<body>
<header>
  <img src="/images/icon-more.png" alt="المزيد">
  <h1>المزيد من الأدوات</h1>
  <button class="back-btn" onclick="window.close(); if(!window.closed){history.back();}">إغلاق</button>
</header>
<div class="container">
  <div class="grid">
    <div class="tool-card" onclick="window.open('/azkar.html','_blank')">
      <div class="tool-emoji">📿</div>
      <div class="tool-name">الأذكار</div>
      <div class="tool-desc">أذكار الصباح والمساء</div>
    </div>
    <div class="tool-card" onclick="window.open('/duaa.html','_blank')">
      <div class="tool-emoji">🤲</div>
      <div class="tool-name">دعاء</div>
      <div class="tool-desc">أدعية مختارة</div>
    </div>
    <div class="tool-card" onclick="window.open('/tasbih.html','_blank')">
      <div class="tool-emoji">📿</div>
      <div class="tool-name">التسبيح</div>
      <div class="tool-desc">عداد تسبيح رقمي</div>
    </div>
    <div class="tool-card" onclick="window.open('/quran.html','_blank')">
      <div class="tool-emoji">📖</div>
      <div class="tool-name">القرآن الكريم</div>
      <div class="tool-desc">قائمة السور والمصحف</div>
    </div>
    <div class="tool-card" onclick="window.open('/qibla.html','_blank')">
      <div class="tool-emoji">🕋</div>
      <div class="tool-name">اتجاه القبلة</div>
      <div class="tool-desc">تحديد القبلة بموقعك</div>
    </div>
    <div class="tool-card" onclick="window.open('/hadith.html','_blank')">
      <div class="tool-emoji">📕</div>
      <div class="tool-name">الحديث</div>
      <div class="tool-desc">أحاديث نبوية شريفة</div>
    </div>
  </div>
</div>
</body>
</html>
